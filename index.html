<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1117" />
    <link rel="icon" type="image/png" href="/logos/howl-icon-wht.png" />
    <link rel="apple-touch-icon" href="/logos/howl-icon-wht.png" />
    <title>The Campfire</title>
    <style>
      @font-face { font-family: 'Montserrat'; font-weight: 800; font-style: normal; src: url('/fonts/montserrat-800.woff2') format('woff2'); }
      @font-face { font-family: 'Libre Franklin'; font-weight: 700; font-style: normal; src: url('/fonts/libre-franklin-700.woff2') format('woff2'); }
      @font-face { font-family: 'Source Sans 3'; font-weight: 400; font-style: normal; src: url('/fonts/source-sans-3-400.woff2') format('woff2'); }
    </style>
  </head>
  <body>
    <div id="root"><main style="padding:48px;font-family:Helvetica,Arial,sans-serif;color:#171717;background:#f7f6f2;min-height:100vh" role="status"><h1>Opening the campfire</h1><p>Loading your workspace…</p><div id="boot-retry" hidden><p>The workspace could not finish loading. Check your connection and try again.</p><button type="button" onclick="location.reload()">Try again</button></div><noscript>Please enable JavaScript to open this workspace.</noscript></main></div>
    <script>
      // This remains usable even when the entry module cannot download or execute.
      window.setTimeout(function () { var retry = document.getElementById('boot-retry'); if (retry) retry.hidden = false; }, 15000);
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
